# Inactive caller template. Render with Build-NuGetPublishWorkflow.ps1 for review.
name: NuGet verified publication

on:
  workflow_run:
    workflows: ["NuGet preparation"]
    types: [completed]

permissions: {}

concurrency:
  group: app-foundation-nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ false && github.repository == 'andregoepel/app-foundation' && github.event.workflow_run.workflow_id == 388401675 && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: ubuntu-24.04
    environment: nuget-publish
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate publication trigger
        if: ${{ false && success() }}
        id: event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = andregoepel/app-foundation
          test "$GITHUB_EVENT_NAME" = workflow_run
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/nuget-publish.yml@refs/heads/main"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -f "$GITHUB_EVENT_PATH" && test ! -L "$GITHUB_EVENT_PATH"
          test "$(stat -c %s -- "$GITHUB_EVENT_PATH")" -le 1048576
          event=$(cat -- "$GITHUB_EVENT_PATH")
          jq -e --arg sha "$GITHUB_SHA" '
            .action == "completed" and .repository.full_name == "andregoepel/app-foundation" and
            (.workflow_run | .repository.full_name == "andregoepel/app-foundation" and
              .head_repository.full_name == "andregoepel/app-foundation" and
              .workflow_id == 388401675 and .path == ".github/workflows/nuget-prepare.yml" and
              .name == "NuGet preparation" and .event == "push" and
              .status == "completed" and .conclusion == "success" and .head_sha == $sha and
              (.head_branch | test("^v(0|[1-9][0-9]{0,4})\\.(0|[1-9][0-9]{0,4})\\.(0|[1-9][0-9]{0,4})\\z")) and
              (.id | type == "number" and . > 0 and . < 9007199254740992 and . == floor) and
              .run_attempt == 1)
          ' <<< "$event" > /dev/null
          main_sha=$(gh api repos/andregoepel/app-foundation/git/ref/heads/main --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA"
          run=$(jq -r '.workflow_run.id' <<< "$event")
          tag=$(jq -r '.workflow_run.head_branch' <<< "$event")
          printf 'sha=%s\nrun=%s\nattempt=1\ntag=%s\nversion=%s\n' "$GITHUB_SHA" "$run" "$tag" "${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out trusted candidate
        if: ${{ false && success() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.event.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned SDK
        if: ${{ false && success() }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Bootstrap trusted verifier
        if: ${{ false && success() }}
        id: bootstrap
        env:
          CANDIDATE_SHA: ${{ steps.event.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          unset APPFOUNDATION_GITHUB_TOKEN APPFOUNDATION_SONAR_TOKEN APPFOUNDATION_SONAR_VERIFY_TOKEN
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset NUGET_API_KEY NUGET_SYMBOL_API_KEY NUGET_AUTH_TOKEN
          test "$(pwd -P)" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          root=$(mktemp -d "$RUNNER_TEMP/nuget-verifier.XXXXXXXX")
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          project=tools/AndreGoepel.AppFoundation.Sonar/AndreGoepel.AppFoundation.Sonar.csproj
          dotnet restore "$project" --locked-mode
          dotnet publish "$project" -c Release --no-restore --no-self-contained -p:SonarQubeTargetsImported=true -o "$root"
          dll="$root/AndreGoepel.AppFoundation.Sonar.dll"
          test -f "$dll" && test ! -L "$dll"
          printf 'dll=%s\n' "$dll" >> "$GITHUB_OUTPUT"

      - name: Download publication handoff
        if: ${{ false && success() }}
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.event.outputs.sha }}
          PREPARATION_RUN: ${{ steps.event.outputs.run }}
          PREPARATION_ATTEMPT: ${{ steps.event.outputs.attempt }}
          RELEASE_TAG: ${{ steps.event.outputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          handoff=$(mktemp -d "$RUNNER_TEMP/nuget-handoff.XXXXXXXX")
          printf 'root=%s\n' "$handoff" >> "$GITHUB_OUTPUT"
          gh run download "$PREPARATION_RUN" --repo andregoepel/app-foundation \
            --name "nuget-origin-$CANDIDATE_SHA-$PREPARATION_RUN-$PREPARATION_ATTEMPT" --dir "$handoff/origin"
          origin="$handoff/origin/origin.json"
          test -f "$origin" && test ! -L "$origin"
          test "$(stat -c %s -- "$origin")" -le 1048576
          pins=$(jq -ce --arg sha "$CANDIDATE_SHA" --arg tag "$RELEASE_TAG" \
            --argjson run "$PREPARATION_RUN" --argjson attempt "$PREPARATION_ATTEMPT" '
            if .schemaVersion == 1 and .repository == "andregoepel/app-foundation" and
              .sha == $sha and .tag == $tag and .runId == $run and .attempt == $attempt and
              .dryRun == true and .releaseEligible == false and
              (.readinessRunId | type == "number" and . > 0 and . < 9007199254740992 and . == floor) and
              (.tagObjectSha | test("^[a-f0-9]{40}\\z")) and
              (.manifestSha256 | test("^[a-f0-9]{64}\\z"))
            then {readiness: .readinessRunId, tagObject: .tagObjectSha, manifest: .manifestSha256}
            else error("Invalid preparation origin") end' "$origin")
          gh run download "$PREPARATION_RUN" --repo andregoepel/app-foundation \
            --name "nuget-batch-$CANDIDATE_SHA-$PREPARATION_RUN-$PREPARATION_ATTEMPT" --dir "$handoff/batch"
          printf 'readiness=%s\ntag-object=%s\nmanifest=%s\n' \
            "$(jq -r '.readiness' <<< "$pins")" "$(jq -r '.tagObject' <<< "$pins")" "$(jq -r '.manifest' <<< "$pins")" >> "$GITHUB_OUTPUT"

      - name: Export publication context
        if: ${{ false && success() }}
        env:
          CANDIDATE_SHA: ${{ steps.event.outputs.sha }}
          PREPARATION_RUN: ${{ steps.event.outputs.run }}
          PREPARATION_ATTEMPT: ${{ steps.event.outputs.attempt }}
          RELEASE_TAG: ${{ steps.event.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.event.outputs.version }}
          BOOTSTRAP_ROOT: ${{ steps.bootstrap.outputs.root }}
          VERIFIER_DLL: ${{ steps.bootstrap.outputs.dll }}
          HANDOFF_ROOT: ${{ steps.download.outputs.root }}
          READINESS_RUN: ${{ steps.download.outputs.readiness }}
          TAG_OBJECT: ${{ steps.download.outputs.tag-object }}
          MANIFEST_SHA256: ${{ steps.download.outputs.manifest }}
        run: |
          set -euo pipefail
          test "$(pwd -P)" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$PREPARATION_ATTEMPT" = 1
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$ ]]
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          [[ "$READINESS_RUN" =~ ^[1-9][0-9]{0,15}$ && "$PREPARATION_RUN" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$TAG_OBJECT" =~ ^[a-f0-9]{40}$ && "$MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          for root in "$BOOTSTRAP_ROOT" "$HANDOFF_ROOT"; do
            test "$(dirname -- "$root")" = "$RUNNER_TEMP"
            test -d "$root" && test ! -L "$root"
            test "$(realpath -e -- "$root")" = "$root"
          done
          [[ "$(basename -- "$BOOTSTRAP_ROOT")" =~ ^nuget-verifier\.[A-Za-z0-9]{8}$ ]]
          [[ "$(basename -- "$HANDOFF_ROOT")" =~ ^nuget-handoff\.[A-Za-z0-9]{8}$ ]]
          test "$VERIFIER_DLL" = "$BOOTSTRAP_ROOT/AndreGoepel.AppFoundation.Sonar.dll"
          test -f "$VERIFIER_DLL" && test ! -L "$VERIFIER_DLL"
          export REPOSITORY_ROOT="$GITHUB_WORKSPACE"
          names=(VERIFIER_DLL REPOSITORY_ROOT CANDIDATE_SHA PACKAGE_VERSION READINESS_RUN RELEASE_TAG HANDOFF_ROOT MANIFEST_SHA256 TAG_OBJECT PREPARATION_RUN PREPARATION_ATTEMPT)
          for name in "${names[@]}"; do
            value="${!name}"
            [[ -n "$value" && "$value" != *$'\n'* && "$value" != *$'\r'* ]]
          done
          for name in "${names[@]}"; do printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"; done

      # INSERT DISABLED PUBLICATION STEPS

      - name: Remove verifier and downloaded handoff
        if: ${{ false && always() && (steps.publish-intent.outcome != 'success' || steps.stored-outcomes.outcome == 'success') }}
        env:
          BOOTSTRAP_ROOT: ${{ steps.bootstrap.outputs.root }}
          HANDOFF_ROOT: ${{ steps.download.outputs.root }}
        run: |
          set -euo pipefail
          for root in "$BOOTSTRAP_ROOT" "$HANDOFF_ROOT"; do
            if test -z "$root"; then continue; fi
            test "$(dirname -- "$root")" = "$RUNNER_TEMP"
            [[ "$(basename -- "$root")" =~ ^nuget-(verifier|handoff)\.[A-Za-z0-9]{8}$ ]]
            test -d "$root" && test ! -L "$root"
            test "$(realpath -e -- "$root")" = "$root"
            rm -rf -- "$root"
          done
